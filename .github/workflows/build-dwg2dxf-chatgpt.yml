name: Build dwg2dxf tool for ChatGPT

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dwg2dxf-chatgpt.yml'

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git file

      - name: Build libdxfrw dwg2dxf
        run: |
          git clone --depth 1 https://github.com/codelibs/libdxfrw.git vendor/libdxfrw
          cmake -S vendor/libdxfrw -B vendor/libdxfrw-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBDXFRW_BUILD_DOC=OFF \
            -DLIBDXFRW_BUILD_DWG2DXF=ON
          cmake --build vendor/libdxfrw-build --target dwg2dxf --parallel 2

      - name: Package binary and provenance
        run: |
          set -euxo pipefail
          mkdir -p artifact/bin
          cp vendor/libdxfrw-build/dwg2dxf/dwg2dxf artifact/bin/dwg2dxf
          chmod +x artifact/bin/dwg2dxf
          strip artifact/bin/dwg2dxf || true
          artifact/bin/dwg2dxf > artifact/USAGE.txt 2>&1 || true
          file artifact/bin/dwg2dxf > artifact/FILE_INFO.txt
          ldd artifact/bin/dwg2dxf > artifact/DEPENDENCIES.txt
          git -C vendor/libdxfrw rev-parse HEAD > artifact/LIBDXFRW_COMMIT.txt
          sha256sum artifact/bin/dwg2dxf > artifact/SHA256SUMS.txt

      - name: Upload converter
        uses: actions/upload-artifact@v4
        with:
          name: dwg2dxf-linux-x64
          path: artifact
          if-no-files-found: error
          retention-days: 1
